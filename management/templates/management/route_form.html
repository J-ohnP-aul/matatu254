{% extends 'base.html' %}
{% block title %}{{ action }} Route{% endblock %}
{% block content %}
  <div style="max-width: 600px; margin: 0 auto; padding: 1rem;">
    <h1>{{ action }} Route</h1>
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Name</label>
        <input type="text" name="name" value="{{ route.name|default:'' }}" required style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Description</label>
        <textarea name="description" style="width: 100%; padding: 0.5rem; min-height: 100px;">{{ route.description|default:'' }}</textarea>
      </div>
      <button type="submit" style="padding: 0.75rem 1.5rem; background: #4caf50; color: white; border: none; border-radius: 4px;">{{ action }}</button>
      <a href="{% url 'management:route-list' %}" style="margin-left: 1rem; padding: 0.75rem 1.5rem; background: #757575; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
  </div>
{% endblock %}
