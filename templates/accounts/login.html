{% extends 'base.html' %}
{% block title %}Sign in · Matatu254{% endblock %}

{% block content %}
  <section class="auth-shell form-panel">
    <h1>Welcome back.</h1>
    <p class="muted">Sign in to continue your journey.</p>
    {% if form.errors %}<div class="alert alert-error" role="alert">Your username and password did not match. Try again.</div>{% endif %}
    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Log in</button>
      <input type="hidden" name="next" value="{% url 'core:dashboard' %}">
    </form>
  </section>
{% endblock content %}
