{% extends 'base.html' %}
{% block title %}{{ action }} Stage{% endblock %}
{% block content %}
  <div style="max-width: 600px; margin: 0 auto; padding: 1rem;">
    <header style="margin-bottom: 1rem;">
      <h1>{{ action }} Stage for {{ route.name }}</h1>
      <a href="{% url 'management:route-stages' route.pk %}" style="color: #666;">← Back to Stages</a>
    </header>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Name</label>
        <input type="text" name="name" value="{{ stage.name|default:'' }}" required style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Sequence Order</label>
        <input type="number" name="sequence_order" value="{{ stage.sequence_order|default:next_order }}" required min="1" style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Latitude</label>
        <input type="text" name="latitude" value="{{ stage.latitude|default:'' }}" required placeholder="-1.2921" style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Longitude</label>
        <input type="text" name="longitude" value="{{ stage.longitude|default:'' }}" required placeholder="36.8219" style="width: 100%; padding: 0.5rem;">
      </div>
      <button type="submit" style="padding: 0.75rem 1.5rem; background: #4caf50; color: white; border: none; border-radius: 4px;">{{ action }}</button>
      <a href="{% url 'management:route-stages' route.pk %}" style="margin-left: 1rem; padding: 0.75rem 1.5rem; background: #757575; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
  </div>
{% endblock %}
