{% extends 'base.html' %}
{% block title %}{{ action }} Matatu{% endblock %}
{% block content %}
  <div class="page-shell admin-form">
    <header class="page-heading"><div><h1>{{ action }} matatu</h1></div></header>
    <form method="post">
      {% csrf_token %}
      <div class="admin-field">
        <label for="matatu-registration">Registration Number</label>
        <input id="matatu-registration" type="text" name="registration_number" value="{{ matatu.registration_number|default:'' }}" required autocomplete="off">
      </div>
      <div class="admin-field">
        <label for="matatu-operator">Operator</label>
        <input id="matatu-operator" type="text" name="operator" value="{{ matatu.operator|default:'' }}" required autocomplete="organization">
      </div>
      <div class="admin-field">
        <label for="matatu-owner">Assign Conductor (Owner)</label>
        <select id="matatu-owner" name="owner">
          <option value="">— None —</option>
          {% for c in conductors %}
            <option value="{{ c.id }}" {% if matatu and matatu.owner_id == c.id %}selected{% endif %}>
              {{ c.username }} ({{ c.get_role_display }})
            </option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">{{ action }}</button>
      <a class="btn btn-outline" href="{% url 'management:matatu-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
