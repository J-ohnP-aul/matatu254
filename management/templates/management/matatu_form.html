{% extends 'base.html' %}
{% block title %}{{ action }} Matatu{% endblock %}
{% block content %}
  <div class="page-shell admin-form">
    <header class="page-heading"><div><h1>{{ action }} matatu</h1></div></header>
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Registration Number</label>
        <input type="text" name="registration_number" value="{{ matatu.registration_number|default:'' }}" required style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Operator</label>
        <input type="text" name="operator" value="{{ matatu.operator|default:'' }}" required style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Assign Conductor (Owner)</label>
        <select name="owner" style="width: 100%; padding: 0.5rem;">
          <option value="">— None —</option>
          {% for c in conductors %}
            <option value="{{ c.id }}" {% if matatu and matatu.owner_id == c.id %}selected{% endif %}>
              {{ c.username }} ({{ c.get_role_display }})
            </option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">{{ action }}</button>
      <a class="btn btn-outline" href="{% url 'management:matatu-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
