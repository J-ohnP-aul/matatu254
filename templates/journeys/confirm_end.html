{% extends 'base.html' %}
{% block title %}End Journey{% endblock %}
{% block content %}
  <section class="auth-shell surface surface-pad">
  <h1>You've reached your stop.</h1>
  <p>Your destination was <strong>{{ journey.destination_stage.name }}</strong>. End this journey now?</p>
  
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">
      End journey
    </button>
    <a href="{% url 'journeys:journey-detail' journey.id %}" style="margin-left: 1rem;">Cancel</a>
  </form>
  </section>
{% endblock %}
