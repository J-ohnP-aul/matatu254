{% extends 'base.html' %}
{% block title %}{{ action }} Route{% endblock %}
{% block content %}
  <div class="page-shell admin-form">
    <header class="page-heading"><div><h1>{{ action }} route</h1></div></header>
    <form method="post">
      {% csrf_token %}
      <div class="admin-field">
        <label for="route-name">Name</label>
        <input id="route-name" type="text" name="name" value="{{ route.name|default:'' }}" required>
      </div>
      <div class="admin-field">
        <label for="route-description">Description</label>
        <textarea id="route-description" name="description">{{ route.description|default:'' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">{{ action }}</button>
      <a class="btn btn-outline" href="{% url 'management:route-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
