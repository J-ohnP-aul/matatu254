{% extends 'base.html' %}
{% block title %}{{ action }} Trip{% endblock %}
{% block content %}
  <div class="page-shell admin-form">
    <header class="page-heading"><div><h1>{{ action }} trip</h1></div></header>
    <form method="post">
      {% csrf_token %}
      <div class="admin-field">
        <label for="trip-matatu">Matatu</label>
        <select id="trip-matatu" name="matatu" required>
          <option value="">— Select Matatu —</option>
          {% for m in matatus %}
            <option value="{{ m.id }}">{{ m.registration_number }} ({{ m.operator }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="admin-field">
        <label for="trip-route">Route</label>
        <select id="trip-route" name="route" required>
          <option value="">— Select Route —</option>
          {% for r in routes %}
            <option value="{{ r.id }}">{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="admin-field">
        <label for="trip-status">Initial Status</label>
        <select id="trip-status" name="status">
          {% for value, label in status_choices %}
            <option value="{{ value }}" {% if value == 'created' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">{{ action }}</button>
      <a class="btn btn-outline" href="{% url 'management:trip-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
