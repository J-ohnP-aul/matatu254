{% extends 'base.html' %}
{% block title %}Edit Config: {{ config.key }}{% endblock %}
{% block content %}
  <div class="page-shell admin-form">
    <header class="page-heading"><div><h1>Edit configuration</h1></div>
      <a class="btn btn-outline" href="{% url 'management:system-config' %}">Back to settings</a>
    </header>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Key</label>
        <input type="text" value="{{ config.key }}" readonly style="width: 100%; padding: 0.5rem; background: #f5f5f5;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Value</label>
        <input type="text" name="value" value="{{ config.value }}" required style="width: 100%; padding: 0.5rem;">
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-outline" href="{% url 'management:system-config' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
